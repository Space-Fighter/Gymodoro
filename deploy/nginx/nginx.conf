server {
    listen 80;
    server_name gymodoro.com www.gymodoro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gymodoro.com www.gymodoro.com;

    ssl_certificate     /etc/letsencrypt/live/gymodoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymodoro.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (apply to every response from this server block) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-Only first: it logs violations in the browser console without
    # blocking anything. Once the console is clean on every page, rename the
    # header to Content-Security-Policy to enforce it. Allows Google sign-in
    # (accounts.google.com), Google Fonts, and YouTube embeds.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://accounts.google.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; frame-src https://accounts.google.com https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Compress text assets (videos/images are already compressed).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    gzip_min_length 1024;

    # One canonical host for search engines: www -> apex.
    if ($host = www.gymodoro.com) {
        return 301 https://gymodoro.com$request_uri;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints everything in /assets/ (the hash changes when content
    # changes), so browsers can cache it for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header in a location replaces the ones above, so repeat them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
