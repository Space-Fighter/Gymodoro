server {
    listen 80;
    server_name gymodoro.com www.gymodoro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gymodoro.com www.gymodoro.com;

    ssl_certificate     /etc/letsencrypt/live/gymodoro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymodoro.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # One canonical host for search engines: www -> apex.
    if ($host = www.gymodoro.com) {
        return 301 https://gymodoro.com$request_uri;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
