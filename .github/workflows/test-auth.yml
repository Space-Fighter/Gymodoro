name: Auth Controller Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/test-auth.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymodoro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Setup test environment
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gymodoro_test
          JWT_SECRET: test-secret-key-this-is-a-very-long-secret-for-testing
          GOOGLE_CLIENT_ID: test-google-client-id
          CLIENT_URL: http://localhost:3000
        run: npx prisma migrate deploy

      - name: Start backend server
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gymodoro_test
          JWT_SECRET: test-secret-key-this-is-a-very-long-secret-for-testing
          GOOGLE_CLIENT_ID: test-google-client-id
          CLIENT_URL: http://localhost:3000
        run: |
          npm run dev > server.log 2>&1 &
          sleep 3
          if ! curl -f http://localhost:3000 > /dev/null 2>&1; then
            echo "Server failed to start"
            cat server.log
            exit 1
          fi

      - name: Run auth endpoint tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gymodoro_test
          JWT_SECRET: test-secret-key-this-is-a-very-long-secret-for-testing
        run: node tests/auth.test.js

      - name: Check server logs on failure
        if: failure()
        working-directory: backend
        run: cat server.log || true

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run ESLint
        working-directory: backend
        run: npm run lint --if-present || echo "No lint script configured"
